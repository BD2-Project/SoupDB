services:
  engine:
    build:
      context: .
    environment:
      PAGE_SIZE: ${PAGE_SIZE:-4096}
      BUFFER_POOL_SIZE: ${BUFFER_POOL_SIZE:-1024}
      REORG_THRESHOLD: ${REORG_THRESHOLD:-0.3}
      BPLUS_ORDER: ${BPLUS_ORDER:-4}
      HASH_GLOBAL_DEPTH_MAX: ${HASH_GLOBAL_DEPTH_MAX:-16}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-100}
      LOCK_TIMEOUT_MS: ${LOCK_TIMEOUT_MS:-5000}
      # Raíz de los documentos en el contenedor. FETCH acepta referencias relativas.
      SOUPDB_DOCUMENT_ROOT: ${SOUPDB_DOCUMENT_ROOT:-/app/documents}
      SOUPDB_PLUGINS: ${SOUPDB_PLUGINS:-0}
      SOUPDB_PLUGINS_DIR: /opt/soupdb/plugins
    ports:
      - "${DRIVER_PORT:-55432}:55432"
    volumes:
      - engine-data:/app/data
      - ${SOUPDB_DOCUMENTS_HOST:-./documents}:/app/documents:ro
      - ./dist/plugins:/opt/soupdb/plugins:ro

  postgres:
    # La comparación espacial usa PostGIS geography para medir en metros.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soupdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soupdb}
      POSTGRES_DB: ${POSTGRES_DB:-soupdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  engine-data:
  postgres-data:
