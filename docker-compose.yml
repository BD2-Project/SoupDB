services:
  engine:
    build:
      context: .
    environment:
      PAGE_SIZE: ${PAGE_SIZE:-4096}
      BUFFER_POOL_SIZE: ${BUFFER_POOL_SIZE:-1024}
      REORG_THRESHOLD: ${REORG_THRESHOLD:-0.3}
      BPLUS_ORDER: ${BPLUS_ORDER:-4}
      HASH_GLOBAL_DEPTH_MAX: ${HASH_GLOBAL_DEPTH_MAX:-16}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-100}
      LOCK_TIMEOUT_MS: ${LOCK_TIMEOUT_MS:-5000}
    ports:
      - "${DRIVER_PORT:-55432}:55432"
    volumes:
      - engine-data:/app/data

  postgres:
    # PostGIS sobre PostgreSQL 16: la comparación 2.2.4 necesita distancias en metros
    # sobre `geography`. El tipo `point` nativo solo da distancia euclidiana en grados,
    # que no es comparable con el haversine del motor.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-soupdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soupdb}
      POSTGRES_DB: ${POSTGRES_DB:-soupdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # web:
  #   build:
  #     context: https://github.com/BD2-Project/SoupChef.git
  #   ports:
  #     - "8080:8080"

volumes:
  engine-data:
  postgres-data: