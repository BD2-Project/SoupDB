name: plugins-release

# Publica en PyPI mediante tags plugins-v* o ejecución manual.
# La publicación usa el secreto PYPI_TOKEN.
on:
  push:
    tags: ["plugins-v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Paquetes a publicar"
        type: choice
        options: [all, core, inverted, vector, plugins]
        default: all

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build selected packages
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "core" ]; then
            uv build --package soupdb --out-dir dist
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "plugins" ] || [ "${{ inputs.target }}" = "inverted" ]; then
            uv build --package soupdb-inverted --out-dir dist
          fi
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.target }}" = "all" ] || [ "${{ inputs.target }}" = "plugins" ] || [ "${{ inputs.target }}" = "vector" ]; then
            uv build --package soupdb-vector --out-dir dist
          fi
      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          test -n "$UV_PUBLISH_TOKEN" || { echo "Falta el secret PYPI_TOKEN"; exit 1; }
          uv publish --check-url https://pypi.org/simple/ dist/*
