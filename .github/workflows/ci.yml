name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group multimedia
      - run: uv run pytest --cov=engine --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  plugins:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: soupdb-inverted
            paths: tests/unit/indexes/inverted
          - package: soupdb-vector
            paths: tests/unit/indexes/test_ivf.py tests/unit/indexes/test_hnsw.py
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group multimedia
      - run: uv run pytest ${{ matrix.paths }}
      - run: uv run python -c "import importlib.metadata as m; print('${{ matrix.package }}', bool(m.entry_points(group='soupdb.plugins')))"