[project]
name = "soupdb"
version = "0.7.1"
description = "Motor de base de datos multimodal: relacional, espacial y vectorial."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "BD2-Project" }]
keywords = ["database", "sql", "spatial", "vector", "multimedia", "storage"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Topic :: Database :: Database Engines/Servers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/BD2-Project/SoupDB"
Documentation = "https://BD2-Project.github.io/SoupDB"

[dependency-groups]
# Aplicación de la Parte 5 (similitud/copyright/remixes de audio): todo lo que
# necesita el servidor real. `soupdb-vector` trae HNSW y el pipeline MFCC (y con
# él librosa, numpy, scikit-learn, soundfile...). No es dependencia del núcleo:
# el paquete `soupdb` sigue sin dependencias externas.
copyright-api = [
  "fastapi>=0.162.5",
  "python-multipart>=0.0.33",
  "soupdb-vector",
  "uvicorn>=0.54.0",
]
dev = [
  { include-group = "copyright-api" },
  "httpx>=0.28.1",
  "hypothesis>=6.0",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "soupdb-inverted",
  "soupdb-vector",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "pymdown-extensions>=10.0",
]
multimedia = [
  "librosa>=0.11.0",
  "numpy>=2.4.6",
  "opencv-python-headless>=5.0.0.93",
  "scikit-learn>=1.9.1",
  "soundfile>=0.14.0",
  "threadpoolctl>=3.7.0",
]

[tool.uv.workspace]
members = ["plugins/*"]

[tool.uv.sources]
soupdb = { workspace = true }
soupdb-inverted = { workspace = true }
soupdb-vector = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: tests intensivos de integracion (activos por defecto; desactivar con SKIP_INTEGRATION=1)",
]

[tool.coverage.run]
source = ["engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
